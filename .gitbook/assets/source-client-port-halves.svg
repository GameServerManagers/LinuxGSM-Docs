<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" font-family="Helvetica, Arial, sans-serif">
<title>One Source server has two ports</title>
<desc>Players and the server browser connect to the server half on port 27015. The client half on port 27005 is part of the built-in game client and stays idle on a dedicated server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="290" rx="12" fill="#FFFFFF"/>
<rect x="190" y="30" width="460" height="230" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="420" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">One Source server (srcds)</text>
<rect x="210" y="80" width="200" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="310" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Server half</text>
<text x="310" y="136" text-anchor="middle" font-size="12" fill="#085041">Port 27015 (game)</text>
<text x="310" y="160" text-anchor="middle" font-size="12" fill="#085041">Players join here</text>
<text x="310" y="184" text-anchor="middle" font-size="12" fill="#085041">Queries answered here</text>
<text x="310" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Busy: forward it</text>
<rect x="430" y="80" width="200" height="160" rx="12" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="530" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Client half</text>
<text x="530" y="136" text-anchor="middle" font-size="12" fill="#444441">Port 27005 (client)</text>
<text x="530" y="160" text-anchor="middle" font-size="12" fill="#444441">Built-in game client</text>
<text x="530" y="184" text-anchor="middle" font-size="12" fill="#444441">No player using it</text>
<text x="530" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Idle: no forward</text>
<rect x="30" y="132" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="100" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Players</text>
<text x="100" y="175" text-anchor="middle" font-size="12" fill="#3C3489">Server browser</text>
<line x1="172" y1="160" x2="206" y2="160" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
