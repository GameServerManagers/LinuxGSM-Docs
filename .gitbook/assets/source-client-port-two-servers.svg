<svg xmlns="http://www.w3.org/2000/svg" width="680" height="276" viewBox="0 0 680 276" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Two Source servers on one host</title>
<desc>Server A takes client port 27005 and runs. Server B with the same client port fails because of strictportbind. Server B with client port 27006 runs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="276" rx="12" fill="#FFFFFF"/>
<rect x="40" y="30" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="175" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Server A starts first</text>
<text x="175" y="73" text-anchor="middle" font-size="12" fill="#3C3489">Game 27015, client 27005</text>
<line x1="312" y1="58" x2="366" y2="58" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="30" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="505" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">OK: runs</text>
<text x="505" y="73" text-anchor="middle" font-size="12" fill="#085041">27005 was free</text>
<rect x="40" y="110" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="175" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Server B, same client port</text>
<text x="175" y="153" text-anchor="middle" font-size="12" fill="#3C3489">Game 27016, client 27005</text>
<line x1="312" y1="138" x2="366" y2="138" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="110" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="505" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">Fails: will not start</text>
<text x="505" y="153" text-anchor="middle" font-size="12" fill="#712B13">27005 taken, -strictportbind</text>
<rect x="40" y="190" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="175" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Server B, clientport 27006</text>
<text x="175" y="233" text-anchor="middle" font-size="12" fill="#3C3489">Game 27016, client 27006</text>
<line x1="312" y1="218" x2="366" y2="218" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="190" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="505" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">OK: runs</text>
<text x="505" y="233" text-anchor="middle" font-size="12" fill="#085041">Each has its own client port</text>
</svg>
